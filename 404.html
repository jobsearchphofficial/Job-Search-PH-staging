<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Page not found | Job Search PH</title>
<meta name="robots" content="noindex"><link rel="icon" href="/favicon.ico">
<script>
// GitHub Pages serves this for any address without a file. Job pages are built every ~2 hours,
// so a brand-new job's address opens through the app until its page exists. Anything else goes home.
(function () {
  var p = location.pathname;
  if (/^\/(jobs\/[A-Za-z0-9_-]{1,64}|employers|safety|jobs)\/?$/.test(p)) {
    var q = location.search ? location.search.slice(1) + "&" : "";
    location.replace("/?" + q + "p=" + encodeURIComponent(p) + location.hash);
  } else {
    location.replace("/");
  }
})();
</script>
