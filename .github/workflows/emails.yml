# Automatic emails (scripts/send-emails.mjs): new applicants (with fit score) and post updates for
# employers, plus a summary for the admin. Runs every 15 minutes; GitHub may start it a few minutes late.
# Needs repo secrets FIREBASE_SERVICE_ACCOUNT and RESEND_API_KEY. Optional repo variables:
# SITE_URL (https://staging.jobsearchph.com in the staging repo) and ADMIN_EMAIL.
name: Automatic emails

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: emails
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Send emails
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
        run: node scripts/send-emails.mjs
